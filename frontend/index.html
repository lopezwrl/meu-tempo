    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=5" />
    <link rel="shortcut icon" href="/favicon.ico?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <link rel="manifest" href="/manifest.webmanifest?v=5" />
    <script>
      // Purge stale Service Worker caches that held the old favicon and force-apply the new icon
      (function () {
        try {
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) {
                if (k !== 'meu-tempo-v5') caches.delete(k);
              });
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) {
                r.update();
              });
            });
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#D63B6A" />
    <meta name="description" content="Meu Tempo — Notas, tarefas e controle real do seu tempo com estética refinada." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Meu Tempo</title>
